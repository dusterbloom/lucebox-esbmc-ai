name: Publish verifier images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: verifier
            image: lucebox-esbmc-ai-verifier
          - target: repair
            image: lucebox-esbmc-ai-repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Smoke-test published image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --volume "$GITHUB_WORKSPACE/tests/container_smoke.cpp:/smoke.cpp:ro" \
            --entrypoint esbmc \
            "$IMAGE_REF" \
            /smoke.cpp --quiet --z3
      - name: Smoke-test repair adapter argument isolation
        if: matrix.target == 'repair'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --entrypoint python \
            "$IMAGE_REF" \
            -c 'import sys; sys.argv = ["lucebox-formal", "propose", "--bundle", "x"]; from lucebox_formal.repair import _esbmc_ai_model_class; _esbmc_ai_model_class(); print("repair adapter CLI: PASS")'
      - name: Record immutable image reference
        run: |
          mkdir -p digests
          printf '%s@%s\n' \
            'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}' \
            '${{ steps.build.outputs.digest }}' \
            > 'digests/${{ matrix.target }}.txt'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.target }}
          path: digests/${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 30
